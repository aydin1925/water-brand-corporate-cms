<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020814"/>
      <stop offset="0.5" stop-color="#051B36"/>
      <stop offset="1" stop-color="#083553"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.77" cy="0.42" r="0.42">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.05" r="0.35">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0FDFF"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="dots" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#7DD3FC" fill-opacity="0.09"/>
    </pattern>
    <style>
      .t{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
      .m{font-family:'JetBrains Mono','SF Mono',Consolas,monospace}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
      @keyframes ripple{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1);opacity:0}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-260px);opacity:0}}
      @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .w1{animation:drift 14s linear infinite}
      .w2{animation:drift 22s linear infinite}
      .w3{animation:drift 32s linear infinite}
      .r{animation:ripple 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .r2{animation-delay:1.2s}.r3{animation-delay:2.4s}
      .d{animation:bob 4s ease-in-out infinite}
      .b{animation:rise 7s ease-in infinite}
      .b2{animation-delay:1.5s;animation-duration:8s}.b3{animation-delay:3s;animation-duration:6s}
      .b4{animation-delay:4.5s;animation-duration:9s}.b5{animation-delay:2.2s}
      .o{animation:spin 40s linear infinite;transform-origin:930px 205px}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- orbit -->
  <g class="o" fill="none" stroke="#7DD3FC" stroke-opacity="0.18">
    <circle cx="930" cy="205" r="150" stroke-dasharray="2 10"/>
    <circle cx="930" cy="205" r="115"/>
    <circle cx="1080" cy="205" r="4" fill="#22D3EE" fill-opacity="0.9" stroke="none"/>
  </g>

  <!-- bubbles -->
  <g fill="none" stroke="#A5F3FC" stroke-width="1.5">
    <circle class="b" cx="830" cy="360" r="5"/>
    <circle class="b b2" cx="1040" cy="370" r="7"/>
    <circle class="b b3" cx="880" cy="380" r="3"/>
    <circle class="b b4" cx="1000" cy="365" r="4"/>
    <circle class="b b5" cx="1110" cy="375" r="3"/>
  </g>

  <!-- ripples -->
  <g fill="none" stroke="#7DD3FC" stroke-width="1.5">
    <ellipse class="r" cx="930" cy="300" rx="150" ry="24"/>
    <ellipse class="r r2" cx="930" cy="300" rx="150" ry="24"/>
    <ellipse class="r r3" cx="930" cy="300" rx="150" ry="24"/>
  </g>

  <!-- drop -->
  <g class="d">
    <path transform="translate(930 112)" d="M0 0 C 28 42 50 70 50 98 A 50 50 0 0 1 -50 98 C -50 70 -28 42 0 0Z" fill="url(#drop)"/>
    <path transform="translate(930 112)" d="M0 0 C 28 42 50 70 50 98 A 50 50 0 0 1 -50 98 C -50 70 -28 42 0 0Z" fill="none" stroke="#fff" stroke-opacity="0.5"/>
    <ellipse cx="912" cy="200" rx="9" ry="16" fill="#fff" opacity="0.55" transform="rotate(20 912 200)"/>
  </g>

  <!-- text -->
  <g transform="translate(80 92)">
    <rect width="168" height="28" rx="14" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4" fill="#22D3EE"/>
    <text x="28" y="19" class="m" font-size="12" fill="#A5F3FC" letter-spacing="2">CORPORATE CMS</text>
  </g>
  <text x="76" y="196" class="t" font-size="86" font-weight="800" fill="url(#title)" letter-spacing="-3.5">Karacapınar</text>
  <text x="80" y="242" class="t" font-size="22" fill="#94A3B8">Site, panel ve talep takibi — tek kod tabanında.</text>

  <g class="t" font-size="14" font-weight="600">
    <g transform="translate(80 276)">
      <rect width="132" height="36" rx="18" fill="#0B2540" stroke="#1E4D73"/>
      <text x="66" y="23" text-anchor="middle" fill="#E2E8F0">Kurumsal Site</text>
    </g>
    <g transform="translate(222 276)">
      <rect width="138" height="36" rx="18" fill="#0B2540" stroke="#1E4D73"/>
      <text x="69" y="23" text-anchor="middle" fill="#E2E8F0">Yönetim Paneli</text>
    </g>
    <g transform="translate(370 276)">
      <rect width="124" height="36" rx="18" fill="#22D3EE"/>
      <text x="62" y="23" text-anchor="middle" fill="#04263A">Talep Takibi</text>
    </g>
  </g>

  <!-- waves -->
  <g class="w3" opacity="0.22"><path fill="#22D3EE" d="M0 360 C150 330 300 390 450 360 S750 330 900 360 S1200 390 1350 360 S1650 330 1800 360 S2100 390 2400 360 V420 H0Z"/></g>
  <g class="w2" opacity="0.35"><path fill="#0EA5E9" d="M0 378 C200 350 400 400 600 378 S1000 350 1200 378 S1600 400 1800 378 S2200 350 2400 378 V420 H0Z"/></g>
  <g class="w1"><path fill="#041A30" d="M0 396 C100 384 200 408 300 396 S500 384 600 396 S800 408 900 396 S1100 384 1200 396 S1400 408 1500 396 S1700 384 1800 396 S2000 408 2100 396 S2300 384 2400 396 V420 H0Z"/></g>
</svg>
